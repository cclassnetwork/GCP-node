name: Global Chat APK

on:
  workflow_dispatch:
  push:
    paths:
      - "GLOBAL_CHAT_P2P.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded GLOBAL_CHAT_P2P.zip
        run: unzip -q GLOBAL_CHAT_P2P.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the engine tests
        continue-on-error: true
        run: |
          python -m pip install --quiet "cryptography==42.0.8" pytest
          cd GLOBAL_CHAT_P2P/python
          python -m pytest -q

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copy the engine into the Android project
        run: bash GLOBAL_CHAT_P2P/android/prepare.sh

      - name: Build both Android APKs
        run: |
          gradle -p GLOBAL_CHAT_P2P/android \
            :app:assembleChatDebug \
            :app:assembleNodeDebug \
            --no-daemon \
            --stacktrace

      - name: Find and verify APKs
        run: |
          echo "Searching for generated APK files..."

          find GLOBAL_CHAT_P2P/android \
            -type f -name "*.apk" -print

          CHAT_DIR="GLOBAL_CHAT_P2P/android/app/build/outputs/apk/chat/debug"
          NODE_DIR="GLOBAL_CHAT_P2P/android/app/build/outputs/apk/node/debug"

          if ! find "$CHAT_DIR" -maxdepth 1 -name "*.apk" -type f | grep -q .; then
            echo "ERROR: Global Chat APK was not generated."
            exit 1
          fi

          if ! find "$NODE_DIR" -maxdepth 1 -name "*.apk" -type f | grep -q .; then
            echo "ERROR: Global Chat Node APK was not generated."
            exit 1
          fi

          echo "Both APKs were generated successfully!"

      - name: Upload Global Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: globalchat-apk
          path: GLOBAL_CHAT_P2P/android/app/build/outputs/apk/chat/debug/*.apk
          if-no-files-found: error

      - name: Upload Global Chat Node APK
        uses: actions/upload-artifact@v4
        with:
          name: globalchat-node-apk
          path: GLOBAL_CHAT_P2P/android/app/build/outputs/apk/node/debug/*.apk
          if-no-files-found: error
